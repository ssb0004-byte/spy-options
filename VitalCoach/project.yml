# XcodeGen spec — generates VitalCoach.xcodeproj. Regenerate after adding/removing files:
#   brew install xcodegen && xcodegen generate
name: VitalCoach
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
packages:
  VitalCore:
    path: Packages/VitalCore
settings:
  base:
    SWIFT_VERSION: "5.0"                 # app target: Swift 5 mode + complete concurrency checking (see docs/ARCHITECTURE.md)
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  VitalCoach:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: VitalCore
      - sdk: HealthKit.framework
    entitlements:
      path: App/Resources/VitalCoach.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: VitalCoach
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "VitalCoach reads the health data you choose (such as weight and body composition from your scale, heart rate and steps) to show your trends. It never writes to Apple Health."
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(VC_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(VC_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  VitalCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: VitalCoach
      - package: VitalCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(VC_BUNDLE_ID).tests
schemes:
  VitalCoach:
    build:
      targets:
        VitalCoach: all
        VitalCoachTests: [test]
    test:
      targets:
        - VitalCoachTests
        - package: VitalCore/VitalCoreTests

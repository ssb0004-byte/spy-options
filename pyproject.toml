[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spy-options"
version = "0.1.0"
description = "SPY Noise-Area intraday momentum strategy: signal engine, backtest, options execution layer, and paper-trading scaffold"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas_market_calendars>=4.3",
    "pyarrow>=14",
]

[tool.setuptools.packages.find]
include = ["spy_options*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
